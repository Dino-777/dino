<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My High School Portfolio</title>
    <!-- 🎭 Google Fonts 임포트 -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* 🎯 기본 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2d3436;
            --secondary: #6c5ce7;
            --accent: #a29bfe;
            --light-bg: #f5f7fa;
            --border: #e8eaed;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
            --white: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 📦 컨테이너 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 🎭 네비게이션 바 */
        nav {
            background: var(--white);
            padding: 20px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--secondary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background: var(--secondary);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* 🎬 히어로 섹션 */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(135deg, rgba(109, 92, 231, 0.1) 0%, rgba(162, 155, 254, 0.1) 100%);
            border-radius: 20px;
            margin: 40px 0;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5em;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-dark);
            line-height: 1.2;
        }

        .hero .emoji {
            font-size: 1.2em;
        }

        .hero p {
            font-size: 1.2em;
            color: var(--text-light);
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 📊 통계 섹션 */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .stat-card {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border-color: var(--secondary);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--text-light);
            font-weight: 500;
        }

        /* 📝 입력 폼 */
        .form-section {
            background: var(--white);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            margin: 60px 0;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 40px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title .emoji {
            font-size: 1.2em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 12px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="text"],
        input[type="date"],
        input[type="url"],
        textarea,
        select {
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 0.95em;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            background: var(--white);
            color: var(--text-dark);
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="url"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-size: 0.95em;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236c5ce7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
        }

        /* 🔘 버튼 */
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
        }

        .btn-success {
            background: var(--success);
            color: var(--white);
        }

        .btn-success:hover {
            background: #00a384;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
            padding: 8px 16px;
            font-size: 0.85em;
        }

        .btn-danger:hover {
            background: #d63031;
        }

        /* 📤 파일 업로드 */
        .file-upload-area {
            border: 2px dashed var(--secondary);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s;
            background: rgba(108, 92, 231, 0.02);
            cursor: pointer;
            position: relative;
        }

        .file-upload-area:hover {
            border-color: var(--accent);
            background: rgba(108, 92, 231, 0.05);
        }

        .file-upload-area.dragover {
            background: rgba(108, 92, 231, 0.1);
            border-color: var(--secondary);
        }

        .file-upload-area input[type="file"] {
            display: none;
        }

        .file-upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .file-upload-text {
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .file-upload-subtext {
            color: var(--text-light);
            font-size: 0.9em;
        }

        /* 📋 파일 목록 */
        .file-list {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-tag {
            background: rgba(108, 92, 231, 0.1);
            color: var(--secondary);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }

        .file-tag .remove {
            cursor: pointer;
            font-weight: bold;
        }

        /* 💬 알림 메시지 */
        .message {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: rgba(0, 184, 148, 0.1);
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .message.error {
            background: rgba(225, 112, 85, 0.1);
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        /* 🎨 포트폴리오 그리드 */
        .portfolio-section {
            margin: 60px 0;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        /* 📌 포트폴리오 카드 */
        .portfolio-card {
            background: var(--white);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.4s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .portfolio-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.15);
        }

        .portfolio-card-image {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 3em;
            position: relative;
            overflow: hidden;
        }

        .portfolio-card img,
        .portfolio-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .portfolio-card-image.has-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            transition: background 0.3s;
        }

        .portfolio-card:hover .portfolio-card-image.has-image::after {
            background: rgba(0, 0, 0, 0.1);
        }

            position: absolute;
            top: 15px;
            left:
